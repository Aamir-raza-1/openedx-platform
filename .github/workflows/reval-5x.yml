name: Revalidate 6x scenarios across all 6 repos (DV8 Round 2)

on:
  push:
    branches:
      - reval/5x
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openedx:
    name: Revalidate scenarios (openedx/openedx-platform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System requirements
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmysqlclient-dev libxmlsec1-dev lynx
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install test requirements
        run: make test-requirements
      - name: Run S1, S2b (hub bug: selected + unselected superset), S4, S5 (leaf bug: selected + unselected superset)
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          mkdir -p out
          # S1 & S4: clean leaf/test change (common/djangoapps/status/models.py & tests.py)
          t0=$(python3 -c 'import time; print(time.time())')
          uv run --no-sync python -Wd -m pytest -o addopts="" -p no:randomly -p no:cacheprovider --nomigrations \
            --ds=lms.envs.test common/djangoapps/status/tests.py lms/tests.py \
            --junitxml=out/s1_lms.xml -o junit_family=legacy > out/s1_lms.txt 2>&1
          uv run --no-sync python -Wd -m pytest -o addopts="" -p no:randomly -p no:cacheprovider --nomigrations \
            --ds=cms.envs.test cms/tests.py \
            --junitxml=out/s1_cms.xml -o junit_family=legacy > out/s1_cms.txt 2>&1
          t1=$(python3 -c 'import time; print(time.time())')
          echo "OPENEDX_S1_S4 sec=$(python3 -c "print(round($t1-$t0, 2))") lms=$(tail -1 out/s1_lms.txt) cms=$(tail -1 out/s1_cms.txt)"

          # S2b: planted bug in shared hub openedx/core/lib/tempdir.py line 29 (os.symlink(src, dest) -> pass in create_symlink)
          python3 -c '
          p = "openedx/core/lib/tempdir.py"
          txt = open(p).read()
          target = "    os.symlink(src, dest)\n"
          assert target in txt
          open(p, "w").write(txt.replace(target, "    pass\n", 1))
          '
          t0=$(python3 -c 'import time; print(time.time())')
          set +e
          uv run --no-sync python -Wd -m pytest -o addopts="" -p no:randomly -p no:cacheprovider --nomigrations \
            --ds=lms.envs.test \
            lms/djangoapps/courseware/tests/test_comprehensive_theming.py \
            xmodule/modulestore/tests/test_modulestore_settings.py \
            lms/tests.py \
            openedx/core/lib/safe_lxml/tests.py \
            openedx/core/lib/x_forwarded_for/tests/test_middleware.py \
            openedx/core/lib/tests/test_cache_utils.py \
            openedx/core/lib/tests/test_command_utils.py \
            openedx/core/lib/tests/test_courses.py \
            openedx/core/lib/tests/test_derived.py \
            openedx/core/lib/tests/test_edx_api_utils.py \
            openedx/core/lib/tests/test_extract_archive.py \
            openedx/core/lib/tests/test_grade_utils.py \
            openedx/core/lib/tests/test_graph_traversals.py \
            openedx/core/lib/tests/test_hash_utils.py \
            openedx/core/lib/tests/test_jwt.py \
            openedx/core/lib/tests/test_log_utils.py \
            openedx/core/lib/tests/test_request_utils.py \
            openedx/core/lib/tests/test_teams_config.py \
            openedx/core/lib/tests/test_time_zone_utils.py \
            openedx/core/lib/tests/test_url_utils.py \
            openedx/core/lib/tests/test_user_util.py \
            --junitxml=out/s2b_selected.xml -o junit_family=legacy > out/s2b_selected.txt 2>&1
          rc_s2b_sel=$?
          uv run --no-sync python -Wd -m pytest -o addopts="" -p no:randomly -p no:cacheprovider --nomigrations \
            --ds=lms.envs.test \
            common/djangoapps/status/tests.py \
            common/djangoapps/util/tests/test_date_utils.py \
            common/djangoapps/util/tests/test_django_utils.py \
            common/djangoapps/util/tests/test_file.py \
            common/djangoapps/util/tests/test_filters.py \
            common/djangoapps/util/tests/test_json_request.py \
            common/djangoapps/util/tests/test_keyword_sub_utils.py \
            common/djangoapps/util/tests/test_password_policy_validators.py \
            common/djangoapps/util/tests/test_string_utils.py \
            openedx/core/djangoapps/heartbeat/tests/test_heartbeat.py \
            openedx/core/djangoapps/dark_lang/tests.py \
            openedx/core/djangoapps/lang_pref/tests/test_api.py \
            openedx/core/djangoapps/lang_pref/tests/test_middleware.py \
            openedx/core/djangoapps/lang_pref/tests/test_views.py \
            openedx/core/djangolib/tests/test_js_utils.py \
            openedx/core/djangolib/tests/test_translation_utils.py \
            xmodule/tests/test_util_duedate.py \
            xmodule/tests/test_util_keys.py \
            xmodule/tests/test_utils_escape_html_characters.py \
            --junitxml=out/s2b_unselected.xml -o junit_family=legacy > out/s2b_unselected.txt 2>&1
          rc_s2b_unsel=$?
          set -e
          t1=$(python3 -c 'import time; print(time.time())')
          echo "OPENEDX_S2B rc_sel=$rc_s2b_sel rc_unsel=$rc_s2b_unsel sec=$(python3 -c "print(round($t1-$t0, 2))") sel=$(tail -1 out/s2b_selected.txt) unsel=$(tail -1 out/s2b_unselected.txt)"
          git checkout -- openedx/core/lib/tempdir.py

          # S5: planted bug in leaf common/djangoapps/status/models.py line 55 (return msg -> return None)
          python3 -c '
          p = "common/djangoapps/status/models.py"
          txt = open(p).read()
          target = "        return msg\n"
          assert target in txt
          open(p, "w").write(txt.replace(target, "        return None\n", 1))
          '
          t0=$(python3 -c 'import time; print(time.time())')
          set +e
          uv run --no-sync python -Wd -m pytest -o addopts="" -p no:randomly -p no:cacheprovider --nomigrations \
            --ds=lms.envs.test common/djangoapps/status/tests.py lms/tests.py \
            --junitxml=out/s5_lms.xml -o junit_family=legacy > out/s5_lms.txt 2>&1
          rc_s5_sel=$?
          uv run --no-sync python -Wd -m pytest -o addopts="" -p no:randomly -p no:cacheprovider --nomigrations \
            --ds=lms.envs.test \
            lms/djangoapps/courseware/tests/test_comprehensive_theming.py \
            xmodule/modulestore/tests/test_modulestore_settings.py \
            openedx/core/lib/safe_lxml/tests.py \
            openedx/core/lib/x_forwarded_for/tests/test_middleware.py \
            openedx/core/lib/tests/test_cache_utils.py \
            openedx/core/lib/tests/test_command_utils.py \
            openedx/core/lib/tests/test_courses.py \
            openedx/core/lib/tests/test_derived.py \
            openedx/core/lib/tests/test_edx_api_utils.py \
            openedx/core/lib/tests/test_extract_archive.py \
            openedx/core/lib/tests/test_grade_utils.py \
            openedx/core/lib/tests/test_graph_traversals.py \
            openedx/core/lib/tests/test_hash_utils.py \
            openedx/core/lib/tests/test_jwt.py \
            openedx/core/lib/tests/test_log_utils.py \
            openedx/core/lib/tests/test_request_utils.py \
            openedx/core/lib/tests/test_teams_config.py \
            openedx/core/lib/tests/test_time_zone_utils.py \
            openedx/core/lib/tests/test_url_utils.py \
            openedx/core/lib/tests/test_user_util.py \
            common/djangoapps/util/tests/test_date_utils.py \
            common/djangoapps/util/tests/test_django_utils.py \
            common/djangoapps/util/tests/test_file.py \
            common/djangoapps/util/tests/test_filters.py \
            common/djangoapps/util/tests/test_json_request.py \
            common/djangoapps/util/tests/test_keyword_sub_utils.py \
            common/djangoapps/util/tests/test_password_policy_validators.py \
            common/djangoapps/util/tests/test_string_utils.py \
            openedx/core/djangoapps/heartbeat/tests/test_heartbeat.py \
            openedx/core/djangoapps/dark_lang/tests.py \
            openedx/core/djangoapps/lang_pref/tests/test_api.py \
            openedx/core/djangoapps/lang_pref/tests/test_middleware.py \
            openedx/core/djangoapps/lang_pref/tests/test_views.py \
            openedx/core/djangolib/tests/test_js_utils.py \
            openedx/core/djangolib/tests/test_translation_utils.py \
            xmodule/tests/test_util_duedate.py \
            xmodule/tests/test_util_keys.py \
            xmodule/tests/test_utils_escape_html_characters.py \
            --junitxml=out/s5_unselected.xml -o junit_family=legacy > out/s5_unselected.txt 2>&1
          rc_s5_unsel=$?
          set -e
          t1=$(python3 -c 'import time; print(time.time())')
          echo "OPENEDX_S5 rc_sel=$rc_s5_sel rc_unsel=$rc_s5_unsel sec=$(python3 -c "print(round($t1-$t0, 2))") sel=$(tail -1 out/s5_lms.txt) unsel=$(tail -1 out/s5_unselected.txt)"
          git checkout -- common/djangoapps/status/models.py
      - uses: actions/upload-artifact@v4
        with:
          name: reval-5x-openedx
          path: out/

  ha-core:
    name: Revalidate scenarios (home-assistant/core)
    runs-on: ubuntu-24.04
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Shallow fetch home-assistant/core at map commit and run S1, S2b, S4, S5
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libturbojpeg0-dev libpcap-dev
          mkdir -p /tmp/ha out
          git -C /tmp/ha init -q
          git -C /tmp/ha remote add origin https://github.com/home-assistant/core.git
          git -C /tmp/ha fetch -q --depth 1 origin 075bdcaab6ca141f2b2cd049b8af46bbb2f881ad
          git -C /tmp/ha checkout -q FETCH_HEAD
          cd /tmp/ha
          uv venv venv
          . venv/bin/activate
          uv pip install -q -r requirements.txt -r requirements_test.txt -c homeassistant/package_constraints.txt
          uv pip install -q -e . --config-settings editable_mode=compat -c homeassistant/package_constraints.txt
          python3 -m script.install_integration_requirements pvoutput climate intent device_automation homeassistant_alerts hassio recorder bluetooth mqtt http websocket_api device_tracker dhcp diagnostics repairs sensor webhook network zeroconf ssdp usb onboarding auth person zone lovelace api config system_log persistent_notification button scene siren number select lock valve
          python3 -m script.translations develop --all > /dev/null

          # Scenario 1: leaf component (homeassistant/components/pvoutput/sensor.py -> 4 test files)
          t0=$(python3 -c 'import time; print(time.time())')
          python3 -m pytest -qq --timeout=30 -p no:sugar -p no:cacheprovider \
            --junitxml="$GITHUB_WORKSPACE/out/ha_s1.xml" -o junit_family=legacy \
            tests/components/pvoutput/test_config_flow.py \
            tests/components/pvoutput/test_diagnostics.py \
            tests/components/pvoutput/test_init.py \
            tests/components/pvoutput/test_sensor.py > "$GITHUB_WORKSPACE/out/ha_s1.txt" 2>&1 || { cat "$GITHUB_WORKSPACE/out/ha_s1.txt"; exit 1; }
          t1=$(python3 -c 'import time; print(time.time())')
          echo "HA_S1 sec=$(python3 -c "print(round($t1-$t0, 2))") $(tail -1 "$GITHUB_WORKSPACE/out/ha_s1.txt")"

          # Scenario 2b: planted bug in shared hub homeassistant/components/climate/__init__.py line 290 (negate-if)
          python3 -c '
          p = "homeassistant/components/climate/__init__.py"
          txt = open(p).read()
          target = "    if declaration is None:\n"
          assert target in txt
          open(p, "w").write(txt.replace(target, "    if not (declaration is None):\n", 1))
          '
          t0=$(python3 -c 'import time; print(time.time())')
          set +e
          python3 -m pytest -qq --timeout=30 -p no:sugar -p no:cacheprovider \
            --junitxml="$GITHUB_WORKSPACE/out/ha_s2b_selected.xml" -o junit_family=legacy \
            tests/components/climate > "$GITHUB_WORKSPACE/out/ha_s2b_selected.txt" 2>&1
          rc_s2b_sel=$?
          python3 -m pytest -qq --timeout=30 -p no:sugar -p no:cacheprovider \
            --junitxml="$GITHUB_WORKSPACE/out/ha_s2b_unselected.xml" -o junit_family=legacy \
            tests/components/pvoutput \
            tests/components/button \
            tests/components/scene \
            tests/components/siren \
            tests/components/number \
            tests/components/select \
            tests/components/lock \
            tests/components/valve \
            tests/components/person \
            tests/components/zone \
            tests/components/system_log \
            tests/components/persistent_notification > "$GITHUB_WORKSPACE/out/ha_s2b_unselected.txt" 2>&1
          rc_s2b_unsel=$?
          set -e
          t1=$(python3 -c 'import time; print(time.time())')
          echo "HA_S2B rc_sel=$rc_s2b_sel rc_unsel=$rc_s2b_unsel sec=$(python3 -c "print(round($t1-$t0, 2))") sel=$(tail -1 "$GITHUB_WORKSPACE/out/ha_s2b_selected.txt") unsel=$(tail -1 "$GITHUB_WORKSPACE/out/ha_s2b_unselected.txt")"
          git checkout -- homeassistant/components/climate/__init__.py

          # Scenario 4: test-only (tests/components/pvoutput/test_sensor.py -> 1 test file)
          t0=$(python3 -c 'import time; print(time.time())')
          python3 -m pytest -qq --timeout=30 -p no:sugar -p no:cacheprovider \
            --junitxml="$GITHUB_WORKSPACE/out/ha_s4.xml" -o junit_family=legacy \
            tests/components/pvoutput/test_sensor.py > "$GITHUB_WORKSPACE/out/ha_s4.txt" 2>&1 || { cat "$GITHUB_WORKSPACE/out/ha_s4.txt"; exit 1; }
          t1=$(python3 -c 'import time; print(time.time())')
          echo "HA_S4 sec=$(python3 -c "print(round($t1-$t0, 2))") $(tail -1 "$GITHUB_WORKSPACE/out/ha_s4.txt")"

          # Scenario 5: planted bug in homeassistant/components/pvoutput/sensor.py line 126 (negate-if)
          python3 -c '
          p = "homeassistant/components/pvoutput/sensor.py"
          txt = open(p).read()
          target = "if description.value_fn(coordinator.data) is not None:"
          assert target in txt
          open(p, "w").write(txt.replace(target, "if not (description.value_fn(coordinator.data) is not None):", 1))
          '
          t0=$(python3 -c 'import time; print(time.time())')
          set +e
          python3 -m pytest -qq --timeout=30 -p no:sugar -p no:cacheprovider \
            --junitxml="$GITHUB_WORKSPACE/out/ha_s5_selected.xml" -o junit_family=legacy \
            tests/components/pvoutput/test_config_flow.py \
            tests/components/pvoutput/test_diagnostics.py \
            tests/components/pvoutput/test_init.py \
            tests/components/pvoutput/test_sensor.py > "$GITHUB_WORKSPACE/out/ha_s5_selected.txt" 2>&1
          rc_s5_sel=$?
          python3 -m pytest -qq --timeout=30 -p no:sugar -p no:cacheprovider \
            --junitxml="$GITHUB_WORKSPACE/out/ha_s5_unselected.xml" -o junit_family=legacy \
            tests/components/climate \
            tests/components/button \
            tests/components/scene \
            tests/components/siren \
            tests/components/number \
            tests/components/select \
            tests/components/lock \
            tests/components/valve \
            tests/components/person \
            tests/components/zone \
            tests/components/system_log \
            tests/components/persistent_notification > "$GITHUB_WORKSPACE/out/ha_s5_unselected.txt" 2>&1
          rc_s5_unsel=$?
          set -e
          t1=$(python3 -c 'import time; print(time.time())')
          echo "HA_S5 rc_sel=$rc_s5_sel rc_unsel=$rc_s5_unsel sec=$(python3 -c "print(round($t1-$t0, 2))") sel=$(tail -1 "$GITHUB_WORKSPACE/out/ha_s5_selected.txt") unsel=$(tail -1 "$GITHUB_WORKSPACE/out/ha_s5_unselected.txt")"
          git checkout -- homeassistant/components/pvoutput/sensor.py
      - uses: actions/upload-artifact@v4
        with:
          name: reval-5x-ha
          path: out/

  pydantic:
    name: Revalidate scenarios (pydantic/pydantic)
    runs-on: ubuntu-24.04
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Shallow fetch pydantic/pydantic at map commit and run S1, S2b (selected + full), S4, S5 (selected + full)
        run: |
          mkdir -p /tmp/pyd out
          git -C /tmp/pyd init -q
          git -C /tmp/pyd remote add origin https://github.com/pydantic/pydantic.git
          git -C /tmp/pyd fetch -q --depth 1 origin 0edb9347fad19f29452037d8fc47331cd2c0a096
          git -C /tmp/pyd checkout -q FETCH_HEAD
          cd /tmp/pyd
          uv sync --all-packages --group testing-extra --all-extras

          # Scenario 1: leaf component (pydantic/experimental/pipeline.py -> 3 test files)
          t0=$(python3 -c 'import time; print(time.time())')
          uv run --no-sync python -m pytest -p no:cacheprovider -q --junitxml="$GITHUB_WORKSPACE/out/pyd_s1.xml" -o junit_family=legacy \
            tests/test_docs.py tests/test_main.py tests/test_pipeline.py > "$GITHUB_WORKSPACE/out/pyd_s1.txt" 2>&1
          t1=$(python3 -c 'import time; print(time.time())')
          echo "PYD_S1 sec=$(python3 -c "print(round($t1-$t0, 2))") $(tail -1 "$GITHUB_WORKSPACE/out/pyd_s1.txt")"

          # Scenario 2b: planted bug in shared hub pydantic/main.py line 1383 (return self.__pydantic_fields_set__ -> return None)
          python3 -c '
          p = "pydantic/main.py"
          txt = open(p).read()
          target = "        return self.__pydantic_fields_set__\n"
          assert target in txt
          open(p, "w").write(txt.replace(target, "        return None\n", 1))
          '
          t0=$(python3 -c 'import time; print(time.time())')
          set +e
          uv run --no-sync python -m pytest -p no:cacheprovider -q --junitxml="$GITHUB_WORKSPACE/out/pyd_s2b_selected.xml" -o junit_family=legacy \
            tests/benchmarks/test_attribute_access.py tests/benchmarks/test_discriminated_unions.py tests/benchmarks/test_fastapi_startup_generics.py tests/benchmarks/test_fastapi_startup_simple.py tests/benchmarks/test_isinstance.py tests/benchmarks/test_model_eq.py tests/benchmarks/test_model_schema_generation.py tests/benchmarks/test_model_schema_generation_recursive.py tests/benchmarks/test_model_serialization.py tests/benchmarks/test_model_validation.py tests/benchmarks/test_north_star.py tests/benchmarks/test_regex.py tests/benchmarks/test_validators_build.py tests/test_abc.py tests/test_aliases.py tests/test_annotated.py tests/test_assert_in_validators.py tests/test_callable.py tests/test_color.py tests/test_computed_fields.py tests/test_config.py tests/test_construction.py tests/test_create_model.py tests/test_dataclasses.py tests/test_datetime.py tests/test_decorators.py tests/test_deferred_annotations.py tests/test_deprecated.py tests/test_deprecated_fields.py tests/test_deprecated_validate_arguments.py tests/test_docs.py tests/test_docs_extraction.py tests/test_dunder_all.py tests/test_edge_cases.py tests/test_errors.py tests/test_exports.py tests/test_fields.py tests/test_forward_ref.py tests/test_generics.py tests/test_internal.py tests/test_json.py tests/test_json_schema.py tests/test_main.py tests/test_missing_sentinel.py tests/test_model_signature.py tests/test_model_validator.py tests/test_networks.py tests/test_networks_ipaddress.py tests/test_parse.py tests/test_pickle.py tests/test_plugins.py tests/test_private_attributes.py tests/test_rich_repr.py tests/test_root_model.py tests/test_serialize.py tests/test_serialize_as_any.py tests/test_strict.py tests/test_structural_pattern_matching.py tests/test_titles.py tests/test_tools.py tests/test_type_adapter.py tests/test_type_alias_type.py tests/test_type_hints.py tests/test_types.py tests/test_types_payment_card_number.py tests/test_types_self.py tests/test_types_typeddict.py tests/test_typing.py tests/test_utils.py tests/test_v1.py tests/test_validate_call.py tests/test_validators.py tests/types/test_bytes.py tests/types/test_counter.py tests/types/test_decimal.py tests/types/test_deque.py tests/types/test_enum.py tests/types/test_float.py tests/types/test_frozenset.py tests/types/test_int.py tests/types/test_iterable.py tests/types/test_list.py tests/types/test_model.py tests/types/test_namedtuple.py tests/types/test_none.py tests/types/test_ordered_dict.py tests/types/test_path.py tests/types/test_pattern.py tests/types/test_sequence.py tests/types/test_set.py tests/types/test_str.py tests/types/test_uuid.py tests/types/unions/test_discriminated_union.py tests/types/unions/test_union.py > "$GITHUB_WORKSPACE/out/pyd_s2b_selected.txt" 2>&1
          rc_s2b_sel=$?
          t_sel=$(python3 -c 'import time; print(time.time())')
          uv run --no-sync python -m pytest -p no:cacheprovider -q --junitxml="$GITHUB_WORKSPACE/out/pyd_s2b_full.xml" -o junit_family=legacy \
            tests > "$GITHUB_WORKSPACE/out/pyd_s2b_full.txt" 2>&1
          rc_s2b_full=$?
          set -e
          t1=$(python3 -c 'import time; print(time.time())')
          echo "PYD_S2B rc_sel=$rc_s2b_sel rc_full=$rc_s2b_full sec_sel=$(python3 -c "print(round($t_sel-$t0, 2))") sec_full=$(python3 -c "print(round($t1-$t_sel, 2))") sel=$(tail -1 "$GITHUB_WORKSPACE/out/pyd_s2b_selected.txt") full=$(tail -1 "$GITHUB_WORKSPACE/out/pyd_s2b_full.txt")"
          git checkout -- pydantic/main.py

          # Scenario 4: test-only (tests/test_pipeline.py -> 2 test files)
          t0=$(python3 -c 'import time; print(time.time())')
          uv run --no-sync python -m pytest -p no:cacheprovider -q --junitxml="$GITHUB_WORKSPACE/out/pyd_s4.xml" -o junit_family=legacy \
            tests/test_docs.py tests/test_pipeline.py > "$GITHUB_WORKSPACE/out/pyd_s4.txt" 2>&1
          t1=$(python3 -c 'import time; print(time.time())')
          echo "PYD_S4 sec=$(python3 -c "print(round($t1-$t0, 2))") $(tail -1 "$GITHUB_WORKSPACE/out/pyd_s4.txt")"

          # Scenario 5: planted bug in pydantic/experimental/pipeline.py line 362 (return None)
          python3 -c '
          p = "pydantic/experimental/pipeline.py"
          txt = open(p).read()
          assert "return self.predicate(lambda v: v.endswith(suffix))" in txt
          open(p, "w").write(txt.replace("return self.predicate(lambda v: v.endswith(suffix))", "return None", 1))
          '
          t0=$(python3 -c 'import time; print(time.time())')
          set +e
          uv run --no-sync python -m pytest -p no:cacheprovider -q --junitxml="$GITHUB_WORKSPACE/out/pyd_s5_selected.xml" -o junit_family=legacy \
            tests/test_docs.py tests/test_main.py tests/test_pipeline.py > "$GITHUB_WORKSPACE/out/pyd_s5_selected.txt" 2>&1
          rc_s5_sel=$?
          t_sel=$(python3 -c 'import time; print(time.time())')
